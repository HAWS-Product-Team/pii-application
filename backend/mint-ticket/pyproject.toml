[project]
name = "mint-ticket"
version = "0.1.0"
description = "Ticket Issuer Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.103",
    "python-ulid>=4.0.1",
]

[project.scripts]
mint-ticket = "mint_ticket.cli:main"
ticket-issuer = "mint_ticket.cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/mint_ticket"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
]
