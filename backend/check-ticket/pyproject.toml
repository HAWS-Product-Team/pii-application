[project]
name = "check-ticket"
version = "0.1.0"
description = "Check Ticket API Gateway Lambda Authorizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "python-ulid>=4.0.1",
    "mint-ticket",
]

[project.scripts]
check-ticket = "check_ticket.cli:main"

[tool.uv]
package = true

[tool.uv.sources]
mint-ticket = { path = "../mint-ticket" }

[tool.hatch.build.targets.wheel]
packages = ["src/check_ticket"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "TRY002",  # Raising Exception("Unauthorized") is the required AWS API Gateway authorizer protocol
    "TRY004",  # API Gateway authorizer requires raising Unauthorized exception on invalid types
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
]
