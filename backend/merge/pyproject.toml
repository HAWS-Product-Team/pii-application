[project]
name = "merge"
version = "0.1.0"
description = "Merges a directory of CSVs into a single file."
readme = "README.md"
authors = [
    { name = "Lance Kind", email = "lancerkind@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.89",
]

[project.scripts]
merge = "merge.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

dependencies = [
    "s3fs>=2026.7.0",
    "boto3>=1.0.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.4",
]
