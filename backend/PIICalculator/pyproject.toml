[project]
name = "piicalculator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "s3fs>=0.4.2",
    "boto3>=1.0.0",
    "numpy>=1.20.0",
    "pandas-stubs~=3.0.5",
]

[project.scripts]
pii-calculator = "piicalculator.cli:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.4",
]
